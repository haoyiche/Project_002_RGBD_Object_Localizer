<title id="title">Level 2 synthetic RGB-D coordinate chain and diagnostic gate</title>
<desc id="desc">The synthetic camera optical coordinate frame transforms to world_demo. An object centroid is a point, not a 6D object frame. Validation and robot publication restrictions are shown below.</desc>
